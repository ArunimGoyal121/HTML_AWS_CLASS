<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navbar</title>
    <style>
        *,html{
            padding: 0;
        }
        body{
            background-color: #f2f2f2;
            font-family: 'times new roman', Times, serif;
            font-size: 12px;
        }
        ul{
            list-style-type: none;
            display: flex;
            justify-content: center;
            margin-top: 10px;
            background-color: rgb(43,58,58);
        }
        ul li{
            margin: 0px  10px;
       }
        ul li a{
            text-decoration: none;
            color: white;
            padding: 5px 6px;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 12px;
        }
        ul li a:hover{
            background-color: rgb(43, 58, 58);
            color: white;
            border-radius: 5px;
            color: aqua;
            text-decoration: underline;
            text-shadow: 0px 1px 2px #710522;

        }
        #apply-now{
            background-color: rgb(241, 91, 32);
            border-radius: 5px;
            padding: 5px 8px;
        } 
        #apply-now a{
            color: white;
            font-size: 12px;

        }
        #apply-now a:hover{
            font-size: 13px;
            text-decoration: none;
            text-shadow: 0px 1px 2px #710522;
        }
        .active{
            color: aqua;    
            font-size: 13px;
            text-decoration: underline;
            text-shadow: 0px 1px 2px #710522;
        }


    </style>
</head>
<body>
    <ul>
        <li id = "apply-now"><a href="https://www.kiet.edu/admissions/closed/" target="_blank"> apply  now </a></li>
        <li><a href="#" class = "active" >home</a></li>
        <li><a href="list.html" target="_blank">about</a></li>
        <li><a href="layout.html" target="_blank">services</a></li>
        <li><a href="#">contact</a></li>
        <li><a href="#">login</a></li>
    </ul>
    
</body>
</html>
