<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Layout</title>
    <style>
        *,html{
            margin: 0;
            padding: 0;     
            box-sizing: border-box;
        }
        body{
            background-color: antiquewhite;
            text-align: center;
        }
        main{
            width: 960px;
            height: 1000px;
            display: grid;
            grid-template-columns: 1;
            grid-template-rows: 100px 80px 480px 300px;
            gap: 10px;
            text-align: center;
        }
        main div{
            background-color: #ccc;
            text-align: center;
        }
        #section  {
            display: grid;
            grid-template-columns: 30% 30% 30%;
            grid-template-rows: 1;
            column-gap: 10px;
            justify-content:space-between;
        }
        #section div{
            background-color: #999;
        }
    </style>
</head>
<body>
    <main>
        <div><h2>Header</h2></div>
        <div><h2>Nav</h2></div>   
        <!--section -->           
        <div id = "section"> 
            <div>box1</div>
            <div>box2</div>
            <div>box3</div>
        </div>
        <!--sectionend-->
        <div><h2>Footer</h2></div>
    </main>
    
</body>
</html>
