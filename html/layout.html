<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;

        }
        html{
            margin : 0;
            padding : 0;
            
        }
        body{
            background-color: #16f929;
            text-align: center;
            
        }
        main{
            width:960px;
            height:1000px;
            background-color: #fff;
            margin: 0 auto;
            padding :0;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        header{
            width: 960px;
            height: 100px;
            background-color: #e9a017;
        }
        nav{
            width: 960px;
            height: 400px;
            background-color: #1caac6;
        }
        section{
            width: 960px;
            height: 400px;
            background-color: #b6e00b;
            display: flex;
            gap: 10px;
        }
        #left{
            flex-grow: 1;
            background-color: #1dbd68;
        }
        #right{
            flex-grow: 2;
            background-color: #0d29b3;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        aside,article{
            background-color: #881ca9;
            flex-grow: 1;
        }
        footer{
            width: 960px;
            height: 100px;
            background-color: #e91717;
        }
    </style>
</head>
<body>
    <main>
        <header>
            <h2>Header</h2>
        </header>
    
    <nav>
        <h2>Navbar</h2>
    </nav>
    <section>
        <div id="left"> </div>
        <div id="right"> 
            <aside>
                <h2>Aside</h2>
            </aside>
            <article>
                <h2>Article</h2>
            </article>
        </div>
        
    </section>
    <footer>
        <h2>Footer</h2>
    </footer>
    </main>
    
</body>
</html>
